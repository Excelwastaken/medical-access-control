services:
  jenkins:
    build: .
    image: medical-assignment-jenkins:local
    container_name: medical-assignment-jenkins
    user: root
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Djava.awt.headless=true"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../analysis:/source/analysis:ro
      - ../../backend/evaluation-results-repeated.json:/source/results.json:ro
      - ../../Jenkinsfile:/source/Jenkinsfile:ro
    restart: unless-stopped

volumes:
  jenkins_home:
